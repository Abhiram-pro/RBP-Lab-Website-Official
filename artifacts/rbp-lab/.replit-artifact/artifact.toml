kind = "web"
previewPath = "/"
title = "RBP Lab Website"
description = "A calm, academic research-lab website for the RNA-Binding Proteins Laboratory at IIT Guwahati, with accessible navigation, route stubs, and a scalable editorial design system."
version = "1.0.0"
id = "artifacts/rbp-lab"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24712

[services.development]
run = "pnpm --filter @workspace/rbp-lab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rbp-lab", "run", "build" ]
serve = "static"
publicDir = "artifacts/rbp-lab/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24712"
BASE_PATH = "/"
